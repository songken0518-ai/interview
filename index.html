<head>

<title>永聚資科技 · 軟體產品工程師 面試題庫</title>
<style>
  :root{
    --bg:#0f1117; --panel:#171a23; --panel2:#1d212c; --line:#2a2f3d;

    --green:#3ecf8e; --star:#ffd166; --code:#0b0d12; --chip:#232838;

  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0; background:var(--bg); color:var(--txt);

  }
  a{color:var(--accent2); text-decoration:none}

    background:var(--code); color:#ffd9b3; padding:2px 6px; border-radius:6px;

  }
  pre{
    background:var(--code); border:1px solid var(--line); border-radius:10px;
    padding:14px 16px; overflow:auto; margin:12px 0;
  }
  pre code{background:none; padding:0; color:#d6e2ff; font-size:.86em; line-height:1.6}

  /* Layout */
  .wrap{display:flex; max-width:1200px; margin:0 auto; gap:26px; padding:0 20px}
  .side{
    width:250px; flex:0 0 250px; position:sticky; top:0; align-self:flex-start;
    height:100vh; overflow-y:auto; padding:24px 0 40px;
  }
  .main{flex:1; min-width:0; padding:24px 0 80px}

  /* Header */
  header.hero{
    background:linear-gradient(135deg,#1c2130,#12141c);
    border:1px solid var(--line); border-radius:var(--radius);
    padding:26px 28px; margin-bottom:22px;
  }
  header.hero h1{margin:0 0 6px; font-size:1.5rem; letter-spacing:.5px}
  header.hero .sub{color:var(--muted); font-size:.95rem}
  .badges{margin-top:14px; display:flex; flex-wrap:wrap; gap:8px}
  .badge{
    background:var(--chip); border:1px solid var(--line); color:var(--muted);
    padding:4px 11px; border-radius:20px; font-size:.8rem;
  }
  .badge.hot{color:var(--accent); border-color:#5a3a22}

  /* Search */
  .search{
    width:100%; padding:11px 14px; background:var(--panel2); color:var(--txt);
    border:1px solid var(--line); border-radius:10px; font-size:.95rem; margin-bottom:16px;
  }
  .search::placeholder{color:#6b7386}

  /* TOC */
  .side h2{font-size:.72rem; letter-spacing:1.5px; color:#6b7386; margin:0 0 10px; text-transform:uppercase}
  .toc a{
    display:block; color:var(--muted); padding:6px 12px; border-radius:8px;
    font-size:.9rem; border-left:2px solid transparent;
  }
  .toc a:hover{background:var(--panel); color:var(--txt)}
  .toc a.active{color:var(--accent); border-left-color:var(--accent); background:var(--panel)}

  /* Sections */
  section{margin-bottom:34px; scroll-margin-top:20px}
  .sec-head{
    display:flex; align-items:center; gap:10px; margin:0 0 14px;
    padding-bottom:10px; border-bottom:1px solid var(--line);
  }
  .sec-num{
    background:var(--accent); color:#1a1200; font-weight:700; font-size:.85rem;
    width:28px; height:28px; border-radius:8px; display:grid; place-items:center; flex:0 0 28px;
  }
  .sec-head h3{margin:0; font-size:1.2rem}
  .sec-note{
    background:var(--panel); border-left:3px solid var(--accent2); color:var(--muted);
    padding:10px 14px; border-radius:0 10px 10px 0; margin:0 0 16px; font-size:.92rem;
  }

  /* Prose card (for non-Q sections) */
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px 20px; margin-bottom:14px;

  .card p{margin:.5em 0}
  .card ul{margin:.4em 0; padding-left:1.3em}
  .card li{margin:.3em 0}

  details.qa{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    margin-bottom:12px; overflow:hidden;
  }
  details.qa[open]{border-color:#3a4257}
  summary.q{
    cursor:pointer; padding:15px 18px; font-weight:600; font-size:1rem;
    display:flex; gap:10px; align-items:flex-start; list-style:none; color:#fff;
  }
  summary.q::-webkit-details-marker{display:none}
  summary.q .qmark{color:var(--accent); font-weight:800; flex:0 0 auto}
  summary.q .arrow{margin-left:auto; color:var(--muted); transition:transform .2s; flex:0 0 auto}
  details.qa[open] summary.q .arrow{transform:rotate(90deg)}
  summary.q:hover{background:var(--panel2)}
  .qbody{padding:2px 18px 18px; border-top:1px solid var(--line)}
  .qbody ul{padding-left:1.25em; margin:.5em 0}
  .qbody li{margin:.35em 0}
  .qbody strong{color:#fff}

  .ans-label{color:var(--accent2); font-weight:700; margin-top:12px}
  .blk{border-radius:10px; padding:11px 14px; margin:12px 0; font-size:.94rem}
  .blk.sum{background:rgba(62,207,142,.09); border:1px solid rgba(62,207,142,.3)}
  .blk.sum b{color:var(--green)}
  .blk.star{background:rgba(255,209,102,.08); border:1px solid rgba(255,209,102,.28)}
  .blk.star b{color:var(--star)}
  .blk.warn{background:rgba(255,138,61,.08); border:1px solid rgba(255,138,61,.3)}
  .blk.warn b{color:var(--accent)}

  blockquote{
    margin:12px 0; padding:12px 16px; background:var(--panel2);
    border-left:3px solid var(--accent); border-radius:0 10px 10px 0; color:#d8dbe6;
  }

  table{width:100%; border-collapse:collapse; margin:12px 0; font-size:.9rem}
  th,td{border:1px solid var(--line); padding:9px 11px; text-align:left; vertical-align:top}
  th{background:var(--panel2); color:#fff}

  .checklist{list-style:none; padding:0}
  .checklist li{padding:7px 0 7px 30px; position:relative; border-bottom:1px dashed var(--line)}
  .checklist li:before{
    content:"☐"; position:absolute; left:4px; top:6px; color:var(--accent); font-size:1.1em;
  }

  .hint{color:var(--muted); font-size:.82rem; text-align:center; margin:20px 0 0}
  .nores{display:none; text-align:center; color:var(--muted); padding:40px}

  /* Mobile */
  @media(max-width:860px){
    .wrap{flex-direction:column; padding:0 14px}
    .side{position:static; width:auto; flex:none; height:auto; padding:14px 0;
      border-bottom:1px solid var(--line); margin-bottom:8px}
    .toc{display:flex; flex-wrap:wrap; gap:4px}
    .toc a{border-left:none; padding:6px 10px; font-size:.82rem}
    .toc a.active{border-left:none}
    .side h2{width:100%}
  }
  .backtop{
    position:fixed; right:20px; bottom:20px; background:var(--accent); color:#1a1200;
    width:46px; height:46px; border-radius:50%; display:grid; place-items:center;
    font-size:1.3rem; cursor:pointer; box-shadow:0 6px 18px rgba(0,0,0,.4); border:none;

  }
  .backtop.show{opacity:1; pointer-events:auto}
</style>

 {id:"s3", num:"3", title:"Java 核心技術題",

  qa:[
   {q:"Q3-1 談談 Java 物件導向三大特性（封裝、繼承、多型）",
    body:`<ul>
     <li><b>封裝</b>：欄位設 private，只透過 public 方法對外開放，隱藏內部實作。例如 Voyago 訂單金額設 private，只能透過 <code>applyDiscount()</code> 改，避免被改成負數。</li>
     <li><b>繼承</b>：子類繼承父類達到重用，但實務上「組合優於繼承」，繼承太深難維護。</li>
     <li><b>多型</b>：同一介面／父類型，執行期依真實型別呼叫對應方法。這是 Spring 依賴注入、面向介面編程的基礎。例：<code>PaymentService</code> 介面下有 <code>CreditCardPayment</code>、<code>LinePayPayment</code>，上層只依賴介面，換金流不用改業務邏輯。</li></ul>`,
    sum:"封裝＝藏資料保護狀態；繼承＝重用但別濫用；多型＝面向介面、可替換實作，是 Spring DI 的基礎。",
    star:"多型怎麼實現？→ 方法覆寫 + 動態綁定，JVM 執行期依實際物件型別查方法表決定呼叫哪個實作。"},
   {q:"Q3-2 == 和 equals() 差別？為什麼覆寫 equals 要一起覆寫 hashCode？",
    body:`<ul>
     <li><code>==</code> 比<b>參考位址</b>（primitive 比值），問「是不是同一物件」。</li>
     <li><code>equals()</code> 預設也比位址，但通常覆寫成<b>比內容</b>。String、Integer 都已覆寫。</li>
     <li><b>hashCode 合約</b>：兩物件 equals 為 true，hashCode 必須相同。HashMap/HashSet 先用 hashCode 找 bucket 再用 equals 比對；只改 equals 不改 hashCode，內容相等的物件會落在不同 bucket，HashSet 會誤放兩個一樣的，Map 也查不到。</li></ul>`,
    sum:"== 比位址、equals 比內容；覆寫 equals 一定要覆寫 hashCode，否則 HashMap/HashSet 會壞掉。",
    star:"String 為什麼適合當 key？→ 不可變，hashCode 算一次固定，且已正確覆寫 equals/hashCode。"},
   {q:"Q3-3 String、StringBuilder、StringBuffer 的差別？",
    body:`<ul>
     <li><b>String</b> 不可變，每次「修改」都產生新物件，迴圈裡用 + 串字串效能差。</li>
     <li><b>StringBuilder</b> 可變、非線程安全但快，單執行緒拼接首選。</li>
     <li><b>StringBuffer</b> 可變、線程安全（方法加 synchronized）但較慢，只在多執行緒共用同一緩衝時用。</li></ul>`,
    sum:"String 不可變；StringBuilder 快但非線程安全；StringBuffer 線程安全但慢。單執行緒拼接用 StringBuilder。"},
   {q:"Q3-4 集合框架：ArrayList vs LinkedList、HashMap 底層原理",
    body:`<ul>
     <li><b>ArrayList vs LinkedList</b>：ArrayList 底層陣列，隨機存取 O(1)、中間增刪 O(n)；LinkedList 雙向鏈結，頭尾增刪 O(1)、隨機存取 O(n)。九成情況用 ArrayList。</li>
     <li><b>HashMap vs HashTable</b>：HashMap 非線程安全、允許 null、快；HashTable 老舊、加鎖慢、不允許 null。要線程安全用 <code>ConcurrentHashMap</code>。</li>
     <li><b>HashMap 底層（JDK 8+）</b>：陣列 +（鏈結串列 or 紅黑樹）。碰撞掛鏈結，鏈長 &gt; 8 且陣列長度 ≥ 64 轉紅黑樹（O(n)→O(log n)）。負載因子 0.75，超過擴容兩倍並 rehash。</li></ul>`,
    sum:"ArrayList 隨機存取快、LinkedList 頭尾增刪快；線程安全用 ConcurrentHashMap；HashMap = 陣列 + 鏈結/紅黑樹，鏈長>8 轉樹，負載因子 0.75 擴容。",
    star:"為什麼容量是 2 的次方？→ 用 hash &amp; (n-1) 位元運算取代取模，更快且分佈更均勻。"},
   {q:"Q3-5 例外處理：checked vs unchecked、finally",
    body:`<ul>
     <li><b>Checked</b>（IOException、SQLException）編譯期強制處理；<b>Unchecked</b>（RuntimeException 家族，如 NPE）不強制。</li>
     <li><code>finally</code> 一定執行，用來釋放資源；更建議用 <b>try-with-resources</b> 自動關閉 AutoCloseable 資源。</li>
     <li><b>原則</b>：別空 catch 吞例外；別用例外控制正常流程；後端用 <code>@ControllerAdvice</code> + <code>@ExceptionHandler</code> 統一轉成一致錯誤格式。</li></ul>`,
    sum:"Checked 編譯期強制、Unchecked 不強制；finally 一定執行，資源釋放優先 try-with-resources；用 @ControllerAdvice 統一處理。"},
   {q:"Q3-6 JVM 記憶體結構與垃圾回收（GC）",
    body:`<ul>
     <li>記憶體分：<b>Heap</b>（物件實例）、<b>Metaspace</b>（類別中繼資料）、<b>Stack</b>（方法呼叫與區域變數）、程式計數器、本地方法堆疊。</li>
     <li>GC 主要在 Heap。Heap 分<b>新生代</b>（Eden + 兩 Survivor）和<b>老年代</b>。新物件進 Eden，熬過幾次 Minor GC 晉升老年代；老年代滿觸發 Full GC（慢、要避免）。</li>
     <li>用<b>可達性分析</b>（從 GC Roots 找不到參考鏈就回收），不是引用計數。</li>
     <li>常見 GC 器：G1（JDK 9+ 預設）、ZGC（低延遲）。</li></ul>`,
    sum:"Heap 分新生代/老年代，物件先進 Eden、熬過晉升；用可達性分析判斷回收；避免頻繁 Full GC。",
    star:"什麼會 OOM？→ 記憶體洩漏（靜態集合一直塞）、一次載入超大資料、遞迴過深 StackOverflow。"},
   {q:"Q3-7 多執行緒／並發：synchronized、volatile、線程池",
    body:`<ul>
     <li><b>synchronized</b>：保證互斥 + 可見性，可鎖方法或區塊。</li>
     <li><b>volatile</b>：只保<b>可見性</b>和禁止指令重排，<b>不保原子性</b>，所以 <code>i++</code> 用 volatile 不安全，要用 synchronized 或 AtomicInteger。</li>
     <li><b>線程池</b>：重用執行緒、控制併發。核心參數：核心數、最大數、佇列、拒絕策略。<b>別用 Executors 預設工廠</b>（佇列無界可能 OOM），自己 new ThreadPoolExecutor 設參數。</li></ul>`,
    sum:"synchronized 保互斥+可見性；volatile 只保可見性不保原子性；線程池要自己設參數避免 OOM。",
    star:"ThreadLocal？→ 每個執行緒有獨立變數副本，常存使用者上下文；用完要 remove()，否則線程池復用會洩漏。"},
   {q:"Q3-8 Java 8 新特性用過哪些？（Lambda、Stream、Optional）",
    body:`<ul>
     <li><b>Lambda</b>：程式更簡潔，如 <code>list.sort((a,b)-&gt;a.getPrice()-b.getPrice())</code>。</li>
     <li><b>Stream</b>：宣告式過濾/映射/聚合，如 <code>orders.stream().filter(...).mapToInt(Order::getAmount).sum()</code>。惰性求值、別做副作用。</li>
     <li><b>Optional</b>：防 NPE，如 <code>opt.orElseThrow(()-&gt;new NotFoundException())</code>；別濫用在欄位型別。</li></ul>`,
    sum:"Lambda 讓程式更簡潔、Stream 做宣告式資料處理、Optional 防 NPE；都在 Voyago 用過。"}
  ]},

 {id:"s4", num:"4", title:"Spring / Spring Boot",
  note:"這份工作的核心框架，一定要熟。重點在「觀念講清楚 + 能對應 Voyago」。",
  qa:[
   {q:"Q4-1 什麼是 IoC 和 DI？Spring 為什麼要用？",
    body:`<ul>
     <li><b>IoC（控制反轉）</b>：物件建立與依賴不再自己 new，交給容器管理，控制權反轉給框架。</li>
     <li><b>DI（依賴注入）</b>：實現 IoC 的手段，容器建立 Bean 時自動注入它依賴的 Bean。</li>
     <li><b>好處</b>：低耦合（依賴介面）、好測試（可注入 mock）、集中管理生命週期。</li>
     <li>例：Voyago 的 <code>OrderService</code> 需要 <code>OrderRepository</code>，建構子宣告即可，Spring 自動注入。</li></ul>`,
    sum:"IoC = 建立權交給容器；DI = 容器自動注入依賴。好處是低耦合、好測試、好替換。",
    star:"三種注入方式？推薦哪種？→ 建構子/Setter/欄位注入。推薦建構子注入：可 final、依賴一目了然、好測試、避免藏循環依賴。"},
   {q:"Q4-2 @Component / @Service / @Repository / @Controller 差別？",
    body:`<p>本質都是 <code>@Component</code> 的特化，都會掃描成 Bean，差在<b>分層語意</b>與額外功能：</p><ul>
     <li><b>@Controller / @RestController</b>：表現層。@RestController = @Controller + @ResponseBody，直接回 JSON。</li>
     <li><b>@Service</b>：業務邏輯層。</li>
     <li><b>@Repository</b>：資料存取層，會把 DB 例外轉成 Spring 統一的 DataAccessException。</li>
     <li><b>@Component</b>：一般 Bean。</li></ul>`,
    sum:"都是 Bean，差在分層語意。@Repository 做例外轉換，@RestController 自動回 JSON。"},
   {q:"Q4-3 Bean 作用域與生命週期？單例 Bean 線程安全嗎？",
    body:`<ul>
     <li>Scope：<code>singleton</code>（預設）、<code>prototype</code>（每次 new）、Web 下 <code>request</code>/<code>session</code>。</li>
     <li><b>單例預設不是線程安全</b>——但我們把 Service/Controller 設計成<b>無狀態</b>（不放可變成員），多執行緒共用也沒問題。一旦放可變成員變數就有並發問題。</li></ul>`,
    sum:"預設 singleton；單例本身非線程安全，但只要 Bean 無狀態就安全。Service 別放可變欄位。"},
   {q:"Q4-4 Spring Boot 自動配置原理？@SpringBootApplication 做了什麼？",
    body:`<ul>
     <li><code>@SpringBootApplication</code> = @SpringBootConfiguration + @EnableAutoConfiguration + @ComponentScan。</li>
     <li><b>自動配置</b>：啟動時讀 classpath 的 spring.factories（新版 AutoConfiguration.imports），依引入的依賴 + @Conditional 條件註解（@ConditionalOnClass、@ConditionalOnMissingBean）按需裝配 Bean。如引入 data-jpa 就自動配 DataSource、EntityManager。</li>
     <li>這就是「約定優於配置」、開箱即用的核心。</li></ul>`,
    sum:"@SpringBootApplication = 設定 + 自動配置 + 掃描；自動配置靠 spring.factories + @Conditional 按依賴裝配 Bean。"},
   {q:"Q4-5 @Transactional 怎麼用？失效情況有哪些？（高頻）",
    body:`<ul>
     <li>加在方法/類別上，內部 DB 操作在同一事務，拋 RuntimeException 整個 rollback。如 Voyago 下單：扣庫存 + 建訂單 + 扣款全成功或全失敗。</li>
     <li><b>失效情況</b>：① 方法非 public；② 同類別內部呼叫 <code>this.methodB()</code> 不走代理；③ catch 例外沒往外拋；④ 預設只回滾 RuntimeException，checked 要設 <code>rollbackFor=Exception.class</code>。</li></ul>`,
    sum:"@Transactional 保一組 DB 操作原子性；失效常見於非 public、同類內部呼叫、吞例外、checked 沒設 rollbackFor。",
    star:"傳播行為？→ 常用 REQUIRED（有就加入沒有就新建）、REQUIRES_NEW（永遠開新事務，如記 log 不想被主事務回滾影響）。"},
   {q:"Q4-6 介紹 Spring MVC 一個請求的處理流程",
    body:`<ul>
     <li>① <code>DispatcherServlet</code> 統一接收 → ② <code>HandlerMapping</code> 找 Controller → ③ <code>HandlerAdapter</code> 呼叫、做參數綁定與驗證 → ④ Controller 執行邏輯 → ⑤ Jackson（HttpMessageConverter）序列化成 JSON 回傳 → ⑥ 例外由 @ControllerAdvice 統一收。</li></ul>`,
    sum:"DispatcherServlet 入口 → HandlerMapping 找 Controller → 執行 → Jackson 轉 JSON，例外由 @ControllerAdvice 收。"}
  ]},

 {id:"s5", num:"5", title:"RESTful API 設計",
  note:"JD 明寫「RESTful API 設計」，很可能深入問，尤其實作細節。",
  qa:[
   {q:"Q5-1 什麼是 RESTful API？設計原則有哪些？",
    body:`<p>REST 是以<b>資源</b>為中心的 API 風格：</p><ul>
     <li>URI 用<b>名詞複數</b>表資源：<code>/users</code>、<code>/orders/123</code>，不要 <code>/getUser</code>。</li>
     <li>用 HTTP 方法表動作：GET/POST/PUT/PATCH/DELETE。</li>
     <li><b>無狀態</b>：每請求自帶資訊（如 token），伺服器不存 session，好水平擴展。</li>
     <li>用狀態碼表結果，回應統一 JSON。</li></ul>
     <p>例：Voyago 訂單 <code>GET /api/orders</code>、<code>GET /api/orders/{id}</code>、<code>POST /api/orders</code>、<code>DELETE /api/orders/{id}</code>。</p>`,
    sum:"REST 以資源為中心，URI 用名詞、動作用 HTTP method、狀態用 status code、無狀態。"},
   {q:"Q5-2 常見 HTTP 狀態碼的意義？",
    body:`<ul>
     <li><b>2xx</b>：200 OK、201 Created（新增）、204 No Content（如刪除）。</li>
     <li><b>4xx</b>：400（參數/驗證錯）、401（未登入/token 失效）、403（沒權限）、404（找不到）、409（衝突，如重複下單）。</li>
     <li><b>5xx</b>：500（程式拋例外）、502/503（閘道/服務不可用）。</li></ul>`,
    sum:"200 成功、201 新增、400 參數錯、401 未登入、403 沒權限、404 找不到、500 伺服器爆。",
    star:"401 vs 403？→ 401「不知道你是誰」（沒登入/token 失效），403「知道你是誰但沒權限」。"},
   {q:"Q5-3 PUT vs POST？什麼是冪等性？",
    body:`<ul>
     <li><b>POST</b> 新增、<b>非冪等</b>：呼叫兩次建兩筆。</li>
     <li><b>PUT</b> 用完整資料取代指定資源、<b>冪等</b>：打 N 次結果一樣。</li>
     <li><b>冪等性</b> = 同請求執行一或多次對伺服器狀態影響相同。GET/PUT/DELETE 冪等，POST 不是。</li>
     <li>實務：支付要設計成冪等（用唯一訂單號去重），避免重複扣款。</li></ul>`,
    sum:"POST 新增不冪等、PUT 取代冪等；冪等 = 打幾次結果都一樣，GET/PUT/DELETE 冪等。"},
   {q:"Q5-4 怎麼做 API 參數驗證和統一錯誤處理？",
    body:`<ul>
     <li><b>驗證</b>：Bean Validation 註解（@NotNull、@NotBlank、@Email、@Min）+ @Valid，Controller 進入前驗 DTO。</li>
     <li><b>統一錯誤</b>：@RestControllerAdvice + @ExceptionHandler 集中攔截，轉成一致格式如 <code>{"code":400,"message":"..."}</code>，前端格式一致、不洩漏 stack trace。</li></ul>`,
    sum:"用 @Valid + 驗證註解驗參數，用 @RestControllerAdvice 統一把例外轉成一致 JSON 錯誤格式。"},
   {q:"Q5-5 JWT 是什麼？Voyago 怎麼做登入驗證？（你的專案有用，必會）",
    body:`<ul>
     <li><b>JWT</b> 三段：Header、Payload（放 id、角色、過期時間）、Signature（伺服器密鑰簽章），Base64 編碼、用 . 連接。</li>
     <li><b>流程</b>：登入成功發 JWT → 前端之後放 <code>Authorization: Bearer xxx</code> → 伺服器驗簽章有效且沒過期就信任身分，不用查 session。</li>
     <li><b>好處</b>：無狀態、好水平擴展。<b>注意</b>：Payload 只編碼不加密（別放敏感資料）、設合理過期、撤銷較難（搭 refresh token/黑名單）。</li>
     <li>Voyago 用 Spring Security + 自訂 JWT filter：攔請求、解析驗證 token、把使用者放進 SecurityContext。</li></ul>`,
    sum:"JWT 三段（header/payload/簽章），登入後發 token、之後放 Authorization header，驗簽即信任身分，無狀態。Voyago 用 Spring Security + 自訂 JWT filter。",
    star:"JWT vs Session？→ Session 狀態存伺服器（要共享 store）；JWT 存 client（無狀態，但撤銷難）。"}
  ]},

 {id:"s6", num:"6", title:"資料庫 / SQL / ORM",
  note:"JD 有「資料庫互動」，必考。你 Voyago 用 MySQL，要能講清楚 SQL + JPA。",
  qa:[
   {q:"Q6-1 SQL JOIN 有哪幾種？INNER 和 LEFT 差在哪？",
    body:`<ul>
     <li><b>INNER JOIN</b>：只回兩表都有對應的（交集）。</li>
     <li><b>LEFT JOIN</b>：左表全留，右表沒對應補 NULL。</li>
     <li><b>RIGHT / FULL OUTER</b>：反過來 / 兩邊都留（MySQL 用 UNION）。</li>
     <li>例：查「所有會員及訂單，含沒下單的會員」要用 <code>members LEFT JOIN orders</code>，用 INNER 會漏掉。</li></ul>`,
    sum:"INNER = 交集；LEFT = 左表全留、右表補 NULL。要含沒關聯的那邊就用 OUTER JOIN。"},
   {q:"Q6-2 索引是什麼？為什麼加速？什麼時候不該用？",
    body:`<ul>
     <li>索引是排序資料結構（通常 <b>B+ Tree</b>），讓查詢從全表掃描 O(n) 變快速定位 O(log n)。</li>
     <li><b>代價</b>：占空間、寫入要維護索引所以變慢。</li>
     <li><b>不該加</b>：資料量小、重複值高（如性別）、頻繁寫入的欄位。</li>
     <li><b>重點</b>：WHERE/JOIN/ORDER BY 常用欄位才加；注意<b>最左前綴</b>；避免索引欄位做函數運算或 <code>LIKE '%xx'</code> 導致失效。</li></ul>`,
    sum:"索引 = B+Tree 排序結構，把全表掃描變快速定位；代價是占空間、拖慢寫入。高頻查詢欄位才加。",
    star:"回表 / 覆蓋索引？→ 二級索引查到主鍵再回撈完整資料叫回表；索引本身就含所需欄位不用回表叫覆蓋索引，更快。"},
   {q:"Q6-3 什麼是 ACID？隔離級別有哪些？",
    body:`<ul>
     <li><b>ACID</b>：原子性、一致性、隔離性、持久性。</li>
     <li><b>隔離級別</b>（鬆→嚴）：Read Uncommitted（髒讀）、Read Committed（Oracle 預設，有不可重複讀）、Repeatable Read（<b>MySQL InnoDB 預設</b>，MVCC）、Serializable（最嚴最慢）。</li></ul>`,
    sum:"ACID = 原子/一致/隔離/持久；隔離越高越安全越慢，MySQL 預設 Repeatable Read，Oracle 預設 Read Committed。",
    star:"髒讀/不可重複讀/幻讀？→ 髒讀=讀到未提交；不可重複讀=同筆兩次讀不同；幻讀=同條件兩次查筆數變了。"},
   {q:"Q6-4 什麼是 N+1 查詢？怎麼解決？（用 ORM 必問）",
    body:`<ul>
     <li>查列表（1 次）後逐筆 lazy load 關聯（N 次），共 N+1 次 DB 往返，效能差。如 100 筆訂單逐筆查會員 → 1+100 次。</li>
     <li><b>解決</b>：用 <code>JOIN FETCH</code>（JPQL）或 <code>@EntityGraph</code> 一次 join 進來；或 @BatchSize 批次抓。核心是「N 次合併成 1 次」。</li></ul>`,
    sum:"N+1 = 查列表後逐筆再查關聯造成大量往返；用 JOIN FETCH / @EntityGraph 一次抓完。"},
   {q:"Q6-5 JPA/Hibernate vs MyBatis？你選哪個？",
    body:`<ul>
     <li><b>JPA/Hibernate</b>：全自動 ORM，CRUD 幾乎不寫 SQL、開發快、可跨庫；複雜查詢/調優較難掌控 SQL。</li>
     <li><b>MyBatis</b>：半自動，SQL 自己寫、完全掌控、適合複雜查詢；要寫較多樣板。</li>
     <li><b>回答</b>：Voyago 用 Spring Data JPA 做 CRUD 很快，複雜報表用原生 SQL 或 MyBatis。兩種都能接受，依團隊規範走。</li></ul>`,
    sum:"JPA 全自動開發快、SQL 較不可控；MyBatis 半自動 SQL 全掌控適合複雜查詢。我 Voyago 用 JPA，也能配合團隊用 MyBatis。"},
   {q:"Q6-6 手寫 SQL：找重複資料 / 每個部門薪水最高的員工",
    body:`<p>找 email 重複：</p>
     <pre><code>SELECT email, COUNT(*) AS cnt
FROM users
GROUP BY email
HAVING COUNT(*) &gt; 1;</code></pre>
     <p>每個部門薪水最高（關聯子查詢）：</p>
     <pre><code>SELECT e.*
FROM employee e
WHERE e.salary = (
    SELECT MAX(salary) FROM employee
    WHERE dept_id = e.dept_id
);</code></pre>
     <p>觀念：<code>WHERE</code> 分組前過濾行、<code>HAVING</code> 分組後過濾聚合結果。</p>`,
    sum:"重複用 GROUP BY + HAVING COUNT>1；分組最大值用關聯子查詢或視窗函數。記住 WHERE 過濾行、HAVING 過濾組。"}
  ]},

 {id:"s7", num:"7", title:"測試（單元 / 整合）",
  note:"JD 明寫要寫單元＋整合測試，是很多轉職者的弱點，面試官很可能追問你實際有沒有寫過。務必補強，至少能講 JUnit + Mockito。",
  qa:[
   {q:"Q7-1 單元測試和整合測試差在哪？",
    body:`<ul>
     <li><b>單元測試</b>：測單一類別/方法，外部依賴用 <b>mock</b> 替換，快、隔離高，驗「這段邏輯對不對」。</li>
     <li><b>整合測試</b>：測多元件串接（Controller→Service→Repository→DB），驗「協作對不對」，慢但接近真實。</li>
     <li><b>測試金字塔</b>：單元多（快）、整合中量、E2E 少（慢）。</li></ul>`,
    sum:"單元測邏輯、mock 掉依賴、快；整合測串接、跑真實流程、慢。金字塔：單元多、E2E 少。"},
   {q:"Q7-2 JUnit 和 Mockito 怎麼用？舉例",
    body:`<ul>
     <li><b>JUnit</b>：@Test 標記，用斷言（assertEquals、assertThrows）驗證，結構走 Given-When-Then。</li>
     <li><b>Mockito</b>：造假依賴，<code>when(...).thenReturn(...)</code> 設回傳、<code>verify(...)</code> 驗呼叫。</li></ul>
     <pre><code>@ExtendWith(MockitoExtension.class)
class OrderServiceTest {
    @Mock OrderRepository orderRepository;
    @InjectMocks OrderService orderService;

    @Test
    void 下單金額為負_應拋出例外() {
        OrderRequest req = new OrderRequest(-100);
        assertThrows(IllegalArgumentException.class,
                     () -&gt; orderService.create(req));
    }
}</code></pre>`,
    sum:"JUnit 寫測試+斷言走 Given-When-Then；Mockito 造假依賴（when/thenReturn、verify）。用 @Mock + @InjectMocks 注入。"},
   {q:"Q7-3 什麼是好的單元測試？覆蓋率越高越好嗎？",
    body:`<ul>
     <li>好測試：快、獨立、可重複、聚焦單一行為、名稱講清楚在測什麼，重視<b>邊界與例外</b>（null、空集合、負數、超額），不只測 happy path。</li>
     <li>覆蓋率是參考不是目標。100% 也可能測很爛（只跑過沒斷言）。重點是測到關鍵業務邏輯與易錯邊界，別為數字去測 getter/setter。</li></ul>`,
    sum:"好測試要快、獨立、聚焦、重邊界與例外；覆蓋率是參考不是目的，關鍵是測對地方。"},
   {q:"Q7-4 Spring Boot 怎麼寫整合測試？",
    body:`<ul>
     <li><code>@SpringBootTest</code> 全整合；<code>@WebMvcTest</code> 只測 Controller（搭 MockMvc）；<code>@DataJpaTest</code> 只測 Repository。</li>
     <li>DB 用 H2 記憶體庫，或 Testcontainers 起真實 MySQL 容器（更接近正式）。</li></ul>
     <div class="blk warn"><b>誠實話術：</b>整合測試寫不多可說「單元測試我用 JUnit + Mockito 寫過，整合測試我了解 @SpringBootTest 和 MockMvc 的做法，實務經驗還在累積，這也是我想深化的部分」。別假裝很熟被追問露餡。</div>`,
    sum:"@SpringBootTest 全整合、@WebMvcTest 測 Controller、@DataJpaTest 測 Repo；DB 用 H2 或 Testcontainers。"}
  ]},

 {id:"s8", num:"8", title:"Code Review、系統設計與協作",
  note:"JD 有「參與 Code Review」「跟 PM、資深架構師合作設計架構」。考工程素養與軟實力，你的教學背景在這反而加分。",
  qa:[
   {q:"Q8-1 你做 Code Review 會看什麼？",
    body:`<ul>
     <li><b>正確性</b>：邏輯、邊界、例外、NPE 風險。</li>
     <li><b>可讀性</b>：命名、方法長度、魔術數字、註解。</li>
     <li><b>設計</b>：重複程式碼、分層有沒有亂、有沒有更簡單寫法。</li>
     <li><b>安全效能</b>：SQL injection、N+1、沒關的資源。</li>
     <li><b>測試</b>：有沒有補上對應測試。</li>
     <li><b>態度</b>：對事不對人、用建議語氣、區分「必須改」和「個人偏好」。教學 review 學生程式碼讓我擅長給建設性回饋。</li></ul>`,
    sum:"看正確性、可讀性、設計、安全效能、測試五層；態度對事不對人、用建議語氣。教學經驗讓我擅長給建設性回饋。"},
   {q:"Q8-2 被 review 時不認同對方意見怎麼辦？",
    body:`<p>先理解對方考量（可能看到我沒注意的風險）；有不同意見就把理由和取捨講清楚、用資料/實例討論，不硬凹也不盲從。目標是專案最好，不是爭輸贏；風格問題尊重團隊規範。</p>`,
    sum:"先理解對方考量，有不同看法就把理由講清楚討論，目標是專案最好而非爭贏；風格問題尊重團隊規範。"},
   {q:"Q8-3 講一下三層架構 / 分層設計",
    body:`<ul>
     <li><b>Controller</b>：收請求、驗參數、呼叫 Service、回傳，不放業務邏輯。</li>
     <li><b>Service</b>：核心業務邏輯、事務控制。</li>
     <li><b>Repository/DAO</b>：只跟 DB 互動。</li>
     <li>用 <b>DTO</b> 在層間傳資料，避免直接暴露 Entity 給前端（安全 + 解耦）。</li></ul>`,
    sum:"Controller 收請求、Service 放業務+事務、Repository 存取 DB，用 DTO 隔離 Entity。職責分明好維護好測試。"},
   {q:"Q8-4 設計一個訂票／訂單系統你會怎麼想？（開放題）",
    body:`<ul>
     <li>先<b>釐清需求</b>：誰用、量級、有無金流、要不要防超賣。</li>
     <li><b>資料模型</b>：User、Product/Trip、Order、Payment 及關聯。</li>
     <li><b>API</b>：REST 風格下單/查詢/取消。</li>
     <li><b>關鍵問題</b>：超賣（樂觀鎖 version 或悲觀鎖/唯一約束）、金流冪等（訂單號去重）、訂單狀態機（待付款→已付款→完成→取消）。</li>
     <li><b>非功能</b>：加索引、記 log、例外統一處理。Voyago 就這樣做訂單模組，處理過並發下單。</li></ul>`,
    sum:"先問需求量級 → 資料模型 + REST API → 超賣（鎖）、金流冪等、狀態機 → 索引、log、例外處理。Voyago 實作過。"},
   {q:"Q8-5 線上系統很慢你怎麼排查？",
    body:`<ul>
     <li>① 先確認是<b>全部慢還是特定 API 慢</b>、何時開始（有沒有剛上版）。</li>
     <li>② 看<b>監控與 log</b>：CPU/記憶體/DB 連線數，定位在應用還是 DB。</li>
     <li>③ DB：<b>慢查詢 log + EXPLAIN</b> 找沒走索引、N+1、缺索引、鎖等待。</li>
     <li>④ 應用：Full GC 頻繁、線程池滿、外部呼叫阻塞。</li>
     <li>⑤ 對症優化（加索引/快取/改查詢/調參）並驗證。</li></ul>`,
    sum:"先確認範圍與時間點 → 看監控/log 定位 App 還是 DB → DB 用慢查詢+EXPLAIN 找缺索引/N+1，App 看 GC/線程/外部呼叫 → 對症下藥並驗證。"}
  ]},

 {id:"s9", num:"9", title:"行為面試題（HR + 主管）",
  note:"決定「你好不好合作、會不會久留」。答案要誠實、正向、有邏輯，不要抱怨前東家。",
  qa:[
   {q:"Q9-1 你是資訊科技老師，為什麼想轉軟體工程師？（幾乎必問）",
    body:`<blockquote>我教程式的過程中，發現最有熱情的其實是「動手把系統從無到有做出來」。教學讓我更確定想走開發，所以課餘持續做專案、上台大培訓班和緯育後端課，也完成 Voyago 全端專案。教學這段不是白走——讓我很擅長把複雜技術講清楚、跟人溝通、把東西整理成文件，這些對團隊協作和寫技術文件很有幫助。現在想把重心正式放到開發，長期深耕後端。</blockquote>
     <p><b>要點：</b>動機是「拉力」（我想做開發）不是「推力」（教書爛）；把教學轉化成工程優勢（溝通、表達、文件）。</p>`,
    sum:"教學讓我更確定熱情在動手開發；已用課餘做專案+上課補齊技能；教學的溝通與文件能力正好對工程協作有幫助。"},
   {q:"Q9-2 你只有約一年經驗，會不會跟不上？",
    body:`<blockquote>經驗確實還在累積，但兩點：第一，CS 基本功紮實，資料結構、Java、資料庫都受過系統訓練，學新東西快；第二，自學和查資料能力強，平時也大量用 AI 工具（如 Claude Code）加速開發與學習。Voyago 從零到部署上線是我自主完成的。我很清楚要補的地方，也願意投入，把這當長期方向不是跳板。</blockquote>`,
    sum:"經驗還在累積，但 CS 底子紮實、自學力強、會用 AI 工具加速；Voyago 獨立完成到上線證明能落地。願意長期投入。"},
   {q:"Q9-3 講一個技術難題怎麼解決的？（STAR 法）",
    body:`<blockquote><b>情境</b>：Voyago 下單時發現使用者快速連點會產生重複訂單。<br>
     <b>任務</b>：保證同一筆下單即使重試也只成立一次。<br>
     <b>行動</b>：重現確認是並發造成，在訂單設計加唯一約束（冪等鍵）+ 關鍵操作用交易包起來，確保扣庫存與建訂單原子性。<br>
     <b>結果</b>：重複下單解決，也實際理解了冪等性和交易在真實場景怎麼用。</blockquote>
     <p>準備 1–2 個這種故事（另一個可講 debug 或效能優化），一定要有「結果 + 學到什麼」。</p>`,
    sum:"準備一個 STAR 故事：Voyago 重複下單 → 加冪等鍵 + 交易 → 解決，學到冪等與交易的實戰。"},
   {q:"Q9-4 你的優點和缺點？",
    body:`<ul>
     <li><b>優點</b>：學習快、負責、擅長溝通與把事情講清楚（教學養成）、習慣寫文件。</li>
     <li><b>缺點</b>（選真實但可改善、不致命的）：以前容易想把細節做到完美花太多時間，後來學會先做可運作版本、再依重要性迭代；另外還在補大型專案實戰，所以特別重視向資深同事學習。</li>
     <li><b>避免</b>：說「沒缺點」或講致命缺點（如「不太會跟人合作」）。</li></ul>`,
    sum:"優點：學習快、負責、溝通強、重文件。缺點：曾過度追求完美→已學會先可用再迭代；正在補大型專案經驗。"},
   {q:"Q9-5 職涯規劃？為什麼選我們公司？",
    body:`<blockquote>短期想在 Java 後端扎實把工程實務做深——API 設計、測試、Code Review 做到位，成為團隊信任的即戰力。中長期希望參與系統架構設計。選貴公司因為這職缺同時有自有產品開發和跟資深架構師學習的機會，公司評價好、團隊重視工程品質（有 Code Review 文化），正是我想成長的環境。</blockquote>
     <p><b>要點：</b>一定針對「這家公司」講具體理由，別講通用答案。</p>`,
    sum:"短期做深 Java 後端成為即戰力、中長期參與架構；選你們因為有自有產品+能跟架構師學+重視工程品質。"},
   {q:"Q9-6 期望薪資？",
    body:`<p>先做功課知道行情。可說：「我對薪資的期望是參考市場行情和職務內容，大約落在 ___ 到 ___ 之間，但我更重視這個機會和成長空間，可依公司規範討論。」別開離譜、也別說「都可以」（顯得沒定位）。</p>`,
    sum:"給有根據的區間 + 表達更重視成長與可談，別說「都可以」也別亂開。面試前查好行情。"},
   {q:"Q9-7 多久可到職？有沒有面試其他公司？",
    body:`<p>到職日據實（在職要交接一般 2 週～1 個月）。有沒有面試別家可誠實說有在看幾個機會，但強調對這職缺特別有興趣——反而顯示你是市場上有選擇的人。</p>`,
    sum:"到職日據實（預留交接）；有面試別家可誠實但強調對這職缺最有興趣。"}
  ]},

 {id:"s10", num:"10", title:"你要反問面試官的問題",
  note:"最後通常問「你有沒有問題想問？」——回答「沒有」是大扣分。準備這幾個，挑合適的問。",
  prose:`<ul>
   <li>「這個職位負責的<b>自有產品</b>主要解決什麼問題？技術棧和架構大概長怎樣？」</li>
   <li>「團隊的<b>開發流程</b>怎麼跑？Code Review、測試、CI/CD 目前的做法？」</li>
   <li>「進來後<b>前三個月</b>會希望我先上手哪些事？」</li>
   <li>「團隊組成大概是？我會跟資深架構師怎麼協作？」</li>
   <li>「以你們角度，做得好的人具備哪些特質？」</li>
   </ul>
   <div class="blk warn"><b>不要一開始就問：</b>薪水、休假、能不能遠端、加不加班（等 offer 或 HR 階段再談）。技術主管面談聚焦產品、技術、成長。</div>
   <div class="blk sum"><b>✅ 濃縮版：</b>至少問 2 題，聚焦產品/技術棧、開發流程、前三個月期待。別一開場就問薪水休假。</div>`},

 {id:"s11", num:"11", title:"面試前一天檢查清單",
  prose:`<ul class="checklist">
   <li><b>自我介紹</b>練到 60–90 秒順口不背稿。</li>
   <li><b>Voyago 能講 5 分鐘</b>：架構、技術棧、你負責什麼、難題怎麼解、重做會怎麼改進。</li>
   <li>準備 <b>1–2 個 STAR 故事</b>（技術難題 / debug / 效能）。</li>
   <li><b>轉職動機、缺點、為什麼選這家、薪資期望</b>各想好一句話。</li>
   <li>複習 <b>Spring 三大題</b>：IoC/DI、@Transactional 失效、自動配置。</li>
   <li>複習 <b>REST + JWT</b>（你專案有用，一定被問）。</li>
   <li>複習 <b>SQL</b>：JOIN、索引、N+1、手寫 GROUP BY。</li>
   <li><b>測試</b>：JUnit + Mockito 能講，整合測試誠實表態。</li>
   <li>準備 <b>2–3 個反問問題</b>。</li>
   <li>查好公司產品/技術棧、想好通勤、帶紙本履歷、提早 10 分鐘到。</li>
   <li>若有線上筆試：先把電腦、IDE、網路測好。</li>
   </ul>`},

 {id:"s12", num:"12", title:"最重要的心法（面試當下）",
  prose:`<ul>
   <li><b>誠實</b>：不會就說「這部分我還在學習，但我理解的方向是…」，別瞎掰被追問露餡更慘。</li>
   <li><b>結論先行</b>：先給答案，再解釋，最後舉例。</li>
   <li><b>主動連結 Voyago</b>：把抽象問題拉回做過的實例，最有說服力。</li>
   <li><b>展現學習力與態度</b>：經驗不是最多，但「學得快、可靠、好合作、想長期做」是初階職最看重的。</li>
   <li><b>穩住節奏</b>：聽不懂就請對方再說一次或確認題意，不用急著答。</li>
   </ul>`}
];

/* ---------- Render ---------- */
const content = document.getElementById('content');
const toc = document.getElementById('toc');

SECTIONS.forEach(s=>{
  // TOC
  const a=document.createElement('a');
  a.href='#'+s.id; a.textContent=s.num+'. '+s.title; a.dataset.target=s.id;
  toc.appendChild(a);

  // Section
  const sec=document.createElement('section'); sec.id=s.id;
  let html=`<div class="sec-head"><span class="sec-num">${s.num}</span><h3>${s.title}</h3></div>`;
  if(s.note) html+=`<div class="sec-note">${s.note}</div>`;
  if(s.prose) html+=`<div class="card">${s.prose}</div>`;
  if(s.qa){
    s.qa.forEach(item=>{
      html+=`<details class="qa"><summary class="q"><span class="qmark">Q</span><span class="qtext">${item.q.replace(/^Q\S+\s/,'')}</span><span class="arrow">▶</span></summary><div class="qbody">`;
      html+=`<div class="ans-label">答：</div>${item.body}`;
      if(item.sum) html+=`<div class="blk sum"><b>✅ 濃縮版：</b>${item.sum}</div>`;
      if(item.star) html+=`<div class="blk star"><b>⭐ 追問：</b>${item.star}</div>`;
      html+=`</div></details>`;
    });
  }
  sec.innerHTML=html;
  content.appendChild(sec);
});

/* ---------- Scrollspy ---------- */
const links=[...toc.querySelectorAll('a')];
const secs=SECTIONS.map(s=>document.getElementById(s.id));
function spy(){
  let cur=secs[0].id, y=window.scrollY+120;
  secs.forEach(se=>{ if(se.offsetTop<=y) cur=se.id; });
  links.forEach(l=>l.classList.toggle('active', l.dataset.target===cur));
}
window.addEventListener('scroll',spy); spy();

/* ---------- Search filter ---------- */
const search=document.getElementById('search');
const nores=document.getElementById('nores');
search.addEventListener('input',()=>{
  const kw=search.value.trim().toLowerCase();
  let anyVisible=false;
  SECTIONS.forEach(s=>{
    const sec=document.getElementById(s.id);
    let secHit=false;
    const dets=sec.querySelectorAll('details.qa');
    if(dets.length){
      dets.forEach(d=>{
        const hit = d.textContent.toLowerCase().includes(kw);
        d.style.display = hit?'':'none';
        if(hit){secHit=true; if(kw) d.open=true; else d.open=false;}
      });
    } else {
      secHit = sec.textContent.toLowerCase().includes(kw);
    }
    sec.style.display = (kw==='' || secHit)?'':'none';
    if(kw==='' || secHit) anyVisible=true;
  });
  nores.style.display = anyVisible?'none':'block';
});

/* ---------- Back to top ---------- */
const bt=document.getElementById('backtop');
window.addEventListener('scroll',()=>bt.classList.toggle('show',window.scrollY>500));
bt.onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
</script>
</body>
</html>
